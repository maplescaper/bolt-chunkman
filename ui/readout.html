<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    font-family: "Segoe UI", Tahoma, sans-serif;
  }
  #badge {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    box-sizing: border-box;
    padding: 4px 8px;
    border-radius: 10px;
    border: 1px solid rgba(255, 200, 90, 0.55);
    background: radial-gradient(circle at 50% 35%, rgba(60, 48, 24, 0.92), rgba(24, 20, 12, 0.94));
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
    color: #ece5d4;
    transition: opacity .12s ease;
  }
  #badge.hidden { display: none; }
  #label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .8px;
    color: #ffce5a; opacity: .9; line-height: 1;
  }
  #id {
    font-size: 18px; font-weight: 700; line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  #region { font-size: 10px; color: #a89e86; line-height: 1; }
</style>
<script>
  // Scale the page content to match the (scaled) browser rectangle.
  (function () {
    var s = parseFloat(new URLSearchParams(location.search).get("s"));
    if (s && s > 0) document.documentElement.style.zoom = s;
  })();
</script>
</head>
<body>
  <div id="badge" class="hidden" title="Current chunk ID">
    <span id="label">Chunk</span>
    <span id="id">&mdash;</span>
    <span id="region"></span>
  </div>
  <script>
    const badge = document.getElementById("badge");
    const idEl = document.getElementById("id");
    const regionEl = document.getElementById("region");

    window.addEventListener("message", (event) => {
      if (typeof event.data !== "object" || !event.data) return;
      if (event.data.type !== "pluginMessage") return;
      let msg;
      try { msg = JSON.parse(new TextDecoder().decode(event.data.content)); }
      catch (err) { return; }
      if (msg.type !== "chunk") return;
      if (msg.show && msg.id !== undefined) {
        idEl.textContent = msg.id;
        regionEl.textContent = "region " + msg.rx + ", " + msg.rz;
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      fetch("https://bolt-api/send-message", { method: "POST", body: "ready" });
    });
  </script>
</body>
</html>
